<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="./manifest.json">
  <title>Control Bodega MP</title>
  
  <!-- Librería para código de barras y cámara -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --warning: #ea580c;
      --purple: #9333ea;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; user-select: none; }

    /* Barra Superior */
    header { background: #0f172a; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; }

    /* Contenedores de Vistas */
    .view-section { display: none; padding: 14px; }
    .view-section.active { display: block; }

    /* Tarjetas */
    .card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; }
    .btn { padding: 10px 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-purple { background: var(--purple); color: white; }
    .btn-danger { background: #dc2626; color: white; }

    input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; margin-top: 4px; margin-bottom: 10px; }

    /* Barra de Navegación Inferior (PWA) */
    nav.tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: white; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .tab-item { flex: 1; text-align: center; color: #64748b; font-size: 0.75rem; cursor: pointer; padding: 6px 0; }
    .tab-item.active { color: var(--primary); font-weight: bold; }

    /* Mapa de Bodega */
    .map-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
    .fila-col { min-width: 140px; background: #e2e8f0; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .fila-header { font-weight: bold; text-align: center; font-size: 0.85rem; padding: 4px; background: white; border-radius: 6px; }
    .pos-box { background: white; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; border: 1px solid #cbd5e1; }
    .pallet-slot { padding: 6px; border-radius: 4px; font-size: 0.75rem; text-align: left; }
    .pallet-slot.fifo-star { background: var(--warning) !important; color: white; font-weight: bold; }
    .pallet-slot.retornado { background: #f3e8ff; border: 1px solid var(--purple); }
    .pallet-slot.empty { border: 1px dashed #cbd5e1; color: #94a3b8; text-align: center; }

    /* Cámara Modal */
    #scanner-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
    #reader { width: 100%; max-width: 400px; background: white; border-radius: 12px; overflow: hidden; }
  </style>
</head>
<body>

  <header>
    <h1 id="app-title">Bodega MP</h1>
    <span id="stock-summary" style="font-size: 0.85rem; background: #334155; padding: 4px 8px; border-radius: 6px;">0 Pallets</span>
  </header>

  <!-- SECCIÓN 1: RECEPCIÓN CAMIÓN -->
  <section id="view-recepcion" class="view-section">
    <div class="card">
      <h3>Cargar Nuevo Camión</h3>
      <label>Componente / Material:</label>
      <select id="rec-material" onchange="actualizarValoresPlantilla()"></select>

      <label>Código:</label>
      <input type="text" id="rec-codigo" readonly>

      <label>Lote Proveedor (Obligatorio):</label>
      <input type="text" id="rec-lote" placeholder="Ej: L-9045A">

      <label>Fila de Bodega:</label>
      <select id="rec-fila"></select>

      <label>Peso por Pallet (kg):</label>
      <input type="number" id="rec-peso" value="1200">

      <label>Cantidad de Pallets:</label>
      <input type="number" id="rec-cantidad" value="40">

      <button class="btn btn-primary" style="width: 100%;" onclick="crearLoteCamion()">Crear Códigos y Guardar</button>
    </div>
  </section>

  <!-- SECCIÓN 2: BODEGA (DESPACHO FIFO POR COMPONENTE) -->
  <section id="view-bodega" class="view-section active">
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <button class="btn btn-primary" style="flex: 1;" onclick="abrirCamara('ENTRADA')">📥 Entrada a Bodega</button>
      <button class="btn btn-warning" style="flex: 1;" onclick="abrirCamara('DESPACHO')">📤 Escaneo General</button>
    </div>

    <h3>Componentes en Stock (Regla FIFO):</h3>
    <div id="lista-fifo-componentes" style="margin-top: 10px;"></div>
  </section>

  <!-- SECCIÓN 3: MAPA VISUAL CON NIVELES (APILAMIENTO DOBLE) -->
  <section id="view-mapa" class="view-section">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3>Layout de Bodega</h3>
      <button class="btn btn-primary" onclick="compactarPasillos()">Correr / Compactar</button>
    </div>
    <div class="map-container" id="mapa-bodega-filas"></div>
  </section>

  <!-- SECCIÓN 4: PRODUCCIÓN / TRÁNSITO -->
  <section id="view-planta" class="view-section">
    <div class="card" style="background: #fdf4ff; border-color: var(--purple);">
      <h3 style="color: var(--purple);">En Tránsito / Planta</h3>
      <p id="planta-kilos">0 kg en producción</p>
    </div>
    <div id="lista-pallets-planta"></div>
  </section>

  <!-- SECCIÓN 5: RESPALDO Y GESTIÓN DE FILAS -->
  <section id="view-respaldo" class="view-section">
    <div class="card">
      <h3>Gestión de Filas Físicas</h3>
      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <input type="text" id="nueva-fila-nombre" placeholder="Ej: Fila 9">
        <button class="btn btn-primary" onclick="agregarFila()">Añadir</button>
      </div>
      <div id="lista-filas-gestion" style="margin-top: 10px;"></div>
    </div>

    <div class="card">
      <h3>Kardex y Respaldo</h3>
      <button class="btn btn-primary" style="width: 100%; margin-bottom: 8px;" onclick="exportarCSV()">Descargar Kardex (.CSV)</button>
      <button class="btn btn-warning" style="width: 100%;" onclick="exportarJSON()">Descargar Copia Completa (.JSON)</button>
    </div>
  </section>

  <!-- MODAL DE CÁMARA (AVFOUNDATION / HTML5 QRCODE) -->
  <div id="scanner-modal">
    <div id="reader"></div>
    <div id="scanner-label" style="color: white; margin-top: 12px; font-weight: bold; text-align: center;"></div>
    <button class="btn btn-danger" style="margin-top: 14px;" onclick="cerrarCamara()">Cancelar</button>
  </div>

  <!-- NAVEGACIÓN INFERIOR (PWA) -->
  <nav class="tabbar">
    <div class="tab-item" onclick="cambiarTab('view-recepcion', this)">Recepción</div>
    <div class="tab-item active" onclick="cambiarTab('view-bodega', this)">Bodega</div>
    <div class="tab-item" onclick="cambiarTab('view-mapa', this)">Mapa</div>
    <div class="tab-item" onclick="cambiarTab('view-planta', this)">Planta</div>
    <div class="tab-item" onclick="cambiarTab('view-respaldo', this)">Respaldo</div>
  </nav>

  <script>
    // --- ESTADO Y PERSISTENCIA PERMANENTE ---
    const DB_KEY = "SISTEMA_BODEGA_MP_DATA";
    
    let db = {
      contador: 100,
      filas: ["Fila 1", "Fila 2", "Fila 3", "Fila 4", "Fila 5", "Fila 6", "Fila 7", "Fila 8"],
      catalogo: [
        { codigo: "RMGE00007", nombre: "Material - PA6 - Genérico - AZOTY", peso: 1200 },
        { codigo: "RMGE00007", nombre: "Material - PA6 - Genérico - JIANGSU", peso: 850 },
        { codigo: "RMGE00012", nombre: "Material - PA6 - 1030MB", peso: 750 },
        { codigo: "RMGE00024", nombre: "Material - PA6/6.6 - 5034 MTX1", peso: 750 },
        { codigo: "RMGE00001", nombre: "Material - Caprolactama", peso: 25 }
      ],
      bultos: [],
      movimientos: []
    };

    function guardarTodo() {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      actualizarIndicadores();
    }

    function cargarTodo() {
      const saved = localStorage.getItem(DB_KEY);
      if (saved) {
        try { db = JSON.parse(saved); } catch (e) { console.error(e); }
      }
      if (!db.filas || db.filas.length === 0) {
        db.filas = ["Fila 1", "Fila 2", "Fila 3", "Fila 4", "Fila 5", "Fila 6", "Fila 7", "Fila 8"];
      }
      poblarSelects();
      actualizarIndicadores();
      renderizarBodega();
      renderizarMapa();
      renderizarPlanta();
      renderizarFilasGestion();
    }

    // --- CAMBIAR PESTAÑAS ---
    function cambiarTab(viewId, el) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      el.classList.add('active');
      if (viewId === 'view-bodega') renderizarBodega();
      if (viewId === 'view-mapa') renderizarMapa();
      if (viewId === 'view-planta') renderizarPlanta();
      if (viewId === 'view-respaldo') renderizarFilasGestion();
    }

    function actualizarIndicadores() {
      const enStock = db.bultos.filter(b => b.estado === 'En Stock');
      document.getElementById('stock-summary').innerText = `${enStock.length} Pallets | ${enStock.reduce((a, b) => a + b.kilos, 0)} kg`;
    }

    function poblarSelects() {
      const selMat = document.getElementById('rec-material');
      selMat.innerHTML = db.catalogo.map((c, i) => `<option value="${i}">${c.nombre}</option>`).join('');
      actualizarValoresPlantilla();

      const selFila = document.getElementById('rec-fila');
      selFila.innerHTML = db.filas.map(f => `<option value="${f}">${f}</option>`).join('');
    }

    function actualizarValoresPlantilla() {
      const idx = document.getElementById('rec-material').value;
      const mat = db.catalogo[idx];
      document.getElementById('rec-codigo').value = mat.codigo;
      document.getElementById('rec-peso').value = mat.peso;
    }

    // --- CREACIÓN DE PALLETS ---
    function crearLoteCamion() {
      const idx = document.getElementById('rec-material').value;
      const mat = db.catalogo[idx];
      const lote = document.getElementById('rec-lote').value.trim();
      const fila = document.getElementById('rec-fila').value;
      const peso = parseFloat(document.getElementById('rec-peso').value);
      const cantidad = parseInt(document.getElementById('rec-cantidad').value);

      if (!lote) { alert('El lote del proveedor es obligatorio'); return; }

      for (let i = 0; i < cantidad; i++) {
        db.contador++;
        const serial = `BTO-${String(db.contador).padStart(5, '0')}`;
        db.bultos.push({
          id: crypto.randomUUID(),
          serial: serial,
          codigoMaterial: mat.codigo,
          nombreMaterial: mat.nombre,
          kilos: peso,
          kilosIniciales: peso,
          lote: lote,
          filaBodega: fila,
          posicionFila: 1,
          nivelApilado: 1,
          fechaCreacion: new Date().toISOString(),
          fechaIngresoBodega: null,
          estado: 'Creado'
        });
      }
      guardarTodo();
      alert(`Se crearon ${cantidad} pallets. Ahora escanéalos en Entrada a Bodega para ingresarlos a stock.`);
      document.getElementById('rec-lote').value = '';
    }

    // --- BODEGA FIFO SEPARADO POR COMPONENTE ---
    function renderizarBodega() {
      const contenedor = document.getElementById('lista-fifo-componentes');
      const enStock = db.bultos.filter(b => b.estado === 'En Stock');

      // Agrupación estricta por Nombre de Componente
      const grupos = {};
      enStock.forEach(b => {
        if (!grupos[b.nombreMaterial]) grupos[b.nombreMaterial] = [];
        grupos[b.nombreMaterial].push(b);
      });

      if (Object.keys(grupos).length === 0) {
        contenedor.innerHTML = `<p style="color: #64748b; font-size: 0.85rem;">No hay componentes en stock.</p>`;
        return;
      }

      contenedor.innerHTML = Object.keys(grupos).map(nombreMat => {
        const lista = grupos[nombreMat].sort((a, b) => new Date(a.fechaIngresoBodega) - new Date(b.fechaIngresoBodega));
        const prioritario = lista[0];
        const totalKilos = lista.reduce((sum, p) => sum + p.kilos, 0);

        return `
          <div class="card" style="border-left: 4px solid var(--warning);">
            <div style="display: flex; justify-content: space-between;">
              <div>
                <strong>${nombreMat}</strong><br>
                <small style="color: #64748b;">${prioritario.codigoMaterial}</small>
              </div>
              <div style="text-align: right;">
                <span style="color: var(--primary); font-weight: bold;">${lista.length} pallets</span><br>
                <small>${totalKilos} kg</small>
              </div>
            </div>

            <div style="background: #fff7ed; border: 1px solid #ffedd5; padding: 10px; border-radius: 6px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="font-size: 0.75rem; color: var(--warning); font-weight: bold;">PRIORITARIO FIFO:</span><br>
                <strong style="font-size: 1.1rem; font-family: monospace;">${prioritario.serial}</strong><br>
                <small>Lote: ${prioritario.lote} | Fila: <b>${prioritario.filaBodega}</b> (Pos ${prioritario.posicionFila} - N${prioritario.nivelApilado})</small>
              </div>
              <button class="btn btn-warning" onclick="abrirCamaraValidada('${prioritario.serial}', '${prioritario.filaBodega}')">Validar Salida</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- MAPA DE BODEGA CON NIVELES Y SECTOR RETORNADOS ---
    function renderizarMapa() {
      const contenedor = document.getElementById('mapa-bodega-filas');
      const filasAMostrar = [...db.filas, "Retornados"];

      contenedor.innerHTML = filasAMostrar.map(fila => {
        const esRet = (fila === "Retornados");
        const palletsFila = db.bultos.filter(b => b.filaBodega === fila && b.estado === 'En Stock');
        
        // Agrupar por posición
        const posiciones = {};
        for (let p = 1; p <= 6; p++) posiciones[p] = { n1: null, n2: null };
        palletsFila.forEach(b => {
          if (posiciones[b.posicionFila]) {
            if (b.nivelApilado === 1) posiciones[b.posicionFila].n1 = b;
            else posiciones[b.posicionFila].n2 = b;
          }
        });

        const htmlPosiciones = Object.keys(posiciones).map(p => {
          const slot = posiciones[p];
          return `
            <div class="pos-box">
              <small style="color: #64748b; font-weight: bold;">Pos ${p}</small>
              ${renderSlot(slot.n2, 'N2 (Arriba)', esRet)}
              ${renderSlot(slot.n1, 'N1 (Piso)', esRet)}
            </div>
          `;
        }).join('');

        return `
          <div class="fila-col" style="${esRet ? 'border: 2px solid var(--purple); background: #faf5ff;' : ''}">
            <div class="fila-header" style="${esRet ? 'color: var(--purple);' : ''}">${fila} (${palletsFila.length})</div>
            ${htmlPosiciones}
          </div>
        `;
      }).join('');
    }

    function renderSlot(pallet, nivelTexto, esRet) {
      if (!pallet) return `<div class="pallet-slot empty">Vacío (${nivelTexto})</div>`;
      return `
        <div class="pallet-slot ${esRet ? 'retornado' : ''}" style="background: #e0f2fe; border: 1px solid var(--primary);">
          <strong>${pallet.serial}</strong><br>
          <span style="font-size: 0.7rem;">${pallet.nombreMaterial.substring(0, 18)}...</span><br>
          <small>${pallet.kilos} kg | Lote: ${pallet.lote}</small>
        </div>
      `;
    }

    // --- COMPACTAR PASILLOS ---
    function compactarPasillos() {
      const filasACompactar = [...db.filas, "Retornados"];
      filasACompactar.forEach(fila => {
        const palletsFila = db.bultos.filter(b => b.filaBodega === fila && b.estado === 'En Stock')
          .sort((a, b) => (a.posicionFila - b.posicionFila) || (a.nivelApilado - b.nivelApilado));

        let posActual = 1;
        let nivelActual = 1;

        palletsFila.forEach(p => {
          p.posicionFila = posActual;
          p.nivelApilado = nivelActual;
          if (nivelActual === 1) {
            nivelActual = 2;
          } else {
            nivelActual = 1;
            posActual++;
          }
        });
      });
      guardarTodo();
      renderizarMapa();
      alert('Pasillos compactados hacia el frente.');
    }

    // --- PLANTA / PRODUCCIÓN ---
    function renderizarPlanta() {
      const contenedor = document.getElementById('lista-pallets-planta');
      const enPlanta = db.bultos.filter(b => b.estado === 'En Tránsito');
      document.getElementById('planta-kilos').innerText = `${enPlanta.reduce((a, b) => a + b.kilos, 0)} kg en tránsito`;

      contenedor.innerHTML = enPlanta.map(b => `
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <strong>${b.serial} - ${b.nombreMaterial}</strong><br>
            <small>Lote: ${b.lote} | Actual: <b>${b.kilos} kg</b></small>
          </div>
          <div style="display: flex; gap: 6px;">
            <button class="btn btn-warning" onclick="pesarPallet('${b.serial}')">Pesar</button>
            <button class="btn btn-purple" onclick="retornarPallet('${b.serial}')">A Bodega</button>
          </div>
        </div>
      `).join('');
    }

    function pesarPallet(serial) {
      const b = db.bultos.find(x => x.serial === serial);
      const peso = prompt(`Ingrese los kilos restantes de ${serial}:`, b.kilos);
      if (peso !== null && !isNaN(parseFloat(peso))) {
        b.kilos = parseFloat(peso);
        if (b.kilos <= 0) b.estado = 'Consumido';
        guardarTodo();
        renderizarPlanta();
      }
    }

    function retornarPallet(serial) {
      const b = db.bultos.find(x => x.serial === serial);
      b.estado = 'En Stock';
      b.filaBodega = 'Retornados';
      b.fechaIngresoBodega = new Date().toISOString();

      // Asignar primera posición libre en retornados
      const ret = db.bultos.filter(x => x.filaBodega === 'Retornados' && x.estado === 'En Stock');
      b.posicionFila = Math.ceil(ret.length / 2) || 1;
      b.nivelApilado = (ret.length % 2 === 0) ? 2 : 1;

      guardarTodo();
      renderizarPlanta();
      alert(`${serial} enviado al sector Retornados de Bodega.`);
    }

    // --- ESCÁNER DE CÁMARA ---
    let html5QrCode;
    let objetivoEsperado = null;

    function abrirCamara(modo) {
      objetivoEsperado = null;
      document.getElementById('scanner-label').innerText = `MODO: ${modo}`;
      document.getElementById('scanner-modal').style.display = 'flex';
      iniciarScanner(modo);
    }

    function abrirCamaraValidada(serial, fila) {
      objetivoEsperado = serial;
      document.getElementById('scanner-label').innerText = `DEBES VALIDAR: ${serial} en [${fila}]`;
      document.getElementById('scanner-modal').style.display = 'flex';
      iniciarScanner('DESPACHO');
    }

    function iniciarScanner(modo) {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        codigoLeido => procesarEscaneo(codigoLeido.trim().toUpperCase(), modo)
      ).catch(err => alert("Error al iniciar cámara: " + err));
    }

    function cerrarCamara() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById('scanner-modal').style.display = 'none';
        });
      }
    }

    function procesarEscaneo(codigo, modo) {
      cerrarCamara();
      const b = db.bultos.find(x => x.serial === codigo);
      if (!b) { alert(`El código ${codigo} no existe.`); return; }

      if (modo === 'ENTRADA') {
        b.estado = 'En Stock';
        b.fechaIngresoBodega = new Date().toISOString();
        guardarTodo();
        alert(`Entrada registrada para ${b.serial}`);
        renderizarBodega();
      } else {
        if (objetivoEsperado && objetivoEsperado !== codigo) {
          alert(`ERROR FIFO: Escaneaste ${codigo}, pero debes despachar primero ${objetivoEsperado}`);
          return;
        }
        b.estado = 'En Tránsito';
        guardarTodo();
        alert(`Despacho validado para ${b.serial}`);
        renderizarBodega();
      }
    }

    // --- REORDENAMIENTO DE FILAS ---
    function renderizarFilasGestion() {
      const cont = document.getElementById('lista-filas-gestion');
      cont.innerHTML = db.filas.map((f, i) => `
        <div style="display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border);">
          <span>${f}</span>
          <div>
            <button class="btn btn-primary" style="padding: 4px 8px;" onclick="moverFila(${i}, -1)">▲</button>
            <button class="btn btn-primary" style="padding: 4px 8px;" onclick="moverFila(${i}, 1)">▼</button>
            <button class="btn btn-danger" style="padding: 4px 8px;" onclick="borrarFila('${f}')">✕</button>
          </div>
        </div>
      `).join('');
    }

    function agregarFila() {
      const nom = document.getElementById('nueva-fila-nombre').value.trim();
      if (nom && !db.filas.includes(nom)) {
        db.filas.push(nom);
        guardarTodo();
        renderizarFilasGestion();
        poblarSelects();
        document.getElementById('nueva-fila-nombre').value = '';
      }
    }

    function moverFila(idx, dir) {
      const nuevoIdx = idx + dir;
      if (nuevoIdx >= 0 && nuevoIdx < db.filas.length) {
        const temp = db.filas[idx];
        db.filas[idx] = db.filas[nuevoIdx];
        db.filas[nuevoIdx] = temp;
        guardarTodo();
        renderizarFilasGestion();
      }
    }

    function borrarFila(f) {
      db.filas = db.filas.filter(x => x !== f);
      guardarTodo();
      renderizarFilasGestion();
      poblarSelects();
    }

    // --- EXPORTACIÓN ---
    function exportarCSV() {
      let csv = "Serial;Material;Codigo;Lote;Fila;Posicion;Nivel;Kilos;Estado\n";
      db.bultos.forEach(b => {
        csv += `${b.serial};${b.nombreMaterial};${b.codigoMaterial};${b.lote};${b.filaBodega};${b.posicionFila};${b.nivelApilado};${b.kilos};${b.estado}\n`;
      });
      descargarArchivo(csv, "Kardex_Bodega.csv", "text/csv");
    }

    function exportarJSON() {
      descargarArchivo(JSON.stringify(db, null, 2), "Respaldo_Bodega.json", "application/json");
    }

    function descargarArchivo(contenido, nombre, tipo) {
      const blob = new Blob([contenido], { type: tipo });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = nombre;
      a.click();
    }

    // Registro de Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    window.onload = cargarTodo;
  </script>
</body>
</html>
